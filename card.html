<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">

        <img src="https://i.pravatar.cc/150" alt="foto">

        <h1>Miguel Angelo</h1>

        <p class="cargo">Desenvolvedor Front-End</p>

        <p class="descricao">
            Estudante de programação apaixonado por HTML, CSS e criação de interfaces modernas.
        </p>

        <div class="botoes">

            <a href="https://github.com/" target="_blank" class="github">
                GitHub
            </a>

            <a href="https://linkedin.com/" target="_blank" class="linkedin">
                LinkedIn
            </a>

        </div>

    </div>

</body>
</html>
